[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-gtm-server"
version = "0.5.0"
description = "MCP server for Google Tag Manager integration with Claude"
authors = [
    {name = "adtechnacity"},
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.23.0,<2",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.0.0",
]

[project.scripts]
mcp-gtm-server = "gtm_mcp.server:main"
gtm-cli = "gtm_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gtm_mcp"]

[project.urls]
Homepage = "https://github.com/adtechnacity/gtm-mcp"
Repository = "https://github.com/adtechnacity/gtm-mcp"
Issues = "https://github.com/adtechnacity/gtm-mcp/issues"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
