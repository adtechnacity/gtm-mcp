name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install uv and Python 3.10 (lowest supported)
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          python-version: "3.10"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Run tests (pytest)
        run: uv run pytest -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Build the image CodeBuild ships
        run: docker build -t gtm-mcp:ci .
      - name: Server loads its tools inside the image
        run: >
          docker run --rm --entrypoint python gtm-mcp:ci -c
          "import asyncio; from gtm_mcp.server import mcp;
          n = len(asyncio.run(mcp.list_tools())); print(n, 'tools'); assert n > 0"
